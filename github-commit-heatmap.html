<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Commit Heatmap</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111b2e;
        --muted: #8a97b6;
        --text: #e8edff;
        --accent: #6aa7ff;
        --border: #22314d;
        --c0: #1b273d;
        --c1: #21406e;
        --c2: #2c5da3;
        --c3: #3d7bd4;
        --c4: #64a6ff;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at top, #14233c, var(--bg));
        color: var(--text);
        min-height: 100vh;
        padding: 1rem;
      }
      .app {
        max-width: 1100px;
        margin: 0 auto;
        background: color-mix(in srgb, var(--panel) 92%, white 8%);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1rem;
      }
      h1 { margin: 0 0 0.75rem; font-size: clamp(1.2rem, 2vw, 1.6rem); }
      p { color: var(--muted); margin-top: 0; }
      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 0.65rem;
        margin-bottom: 0.9rem;
      }
      .field { display: flex; flex-direction: column; gap: 0.35rem; }
      label { font-size: 0.86rem; color: #c7d2ef; }
      input {
        width: 100%;
        background: #0d1729;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.55rem 0.65rem;
      }
      .buttons { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.8rem 0 0.4rem; }
      button {
        border: 1px solid var(--border);
        background: #0f203d;
        color: var(--text);
        border-radius: 8px;
        padding: 0.52rem 0.72rem;
        cursor: pointer;
      }
      button.primary { background: #1f4b8b; border-color: #2f65b1; }
      button:hover { filter: brightness(1.08); }
      .status {
        min-height: 1.5rem;
        color: #d4defa;
        margin: 0.45rem 0 0.85rem;
        font-size: 0.92rem;
      }
      .status.error { color: #ffc6c6; }
      .status.loading { color: #b7cdfd; }

      .heatmap-shell { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; padding: 0.7rem; background: #0d1729; }
      .calendar {
        display: grid;
        grid-auto-flow: column;
        grid-template-rows: repeat(7, 12px);
        gap: 3px;
        width: max-content;
        min-width: 100%;
      }
      .day {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        background: var(--c0);
      }
      .l1 { background: var(--c1); }
      .l2 { background: var(--c2); }
      .l3 { background: var(--c3); }
      .l4 { background: var(--c4); }

      .legend {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.35rem;
        margin-top: 0.6rem;
        color: var(--muted);
        font-size: 0.78rem;
      }
      .swatch { width: 12px; height: 12px; border-radius: 2px; }
      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0.55rem 0 0.2rem;
        gap: 0.6rem;
        flex-wrap: wrap;
      }
      .meta small { color: var(--muted); }

      @media (max-width: 640px) {
        .app { padding: 0.8rem; }
        .calendar { grid-template-rows: repeat(7, 10px); gap: 2px; }
        .day, .swatch { width: 10px; height: 10px; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>GitHub Commit Heatmap</h1>
      <p>
        Enter your GitHub username. Add a Personal Access Token (classic or fine-grained) to include private repos and avoid strict rate limits.
        Token is used only in your browser session and is never saved.
      </p>

      <section class="controls" aria-label="Heatmap controls">
        <div class="field">
          <label for="username">GitHub Username</label>
          <input id="username" type="text" placeholder="e.g. Dev-Venom" />
        </div>
        <div class="field">
          <label for="token">GitHub Token (optional)</label>
          <input id="token" type="password" placeholder="ghp_... or github_pat_..." />
        </div>
        <div class="field">
          <label for="repo">Fallback repo (owner/name)</label>
          <input id="repo" type="text" placeholder="Dev-Venom/career-tracker-ui" />
        </div>
      </section>

      <div class="buttons">
        <button id="loadAll" class="primary">Load all repositories</button>
        <button id="loadRepo">Load single repository</button>
        <button id="sample">Use sample data</button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <div class="meta">
        <small id="summary">Showing last 365 days</small>
        <small id="mode">Mode: waiting</small>
      </div>

      <section class="heatmap-shell" aria-label="Commit heatmap">
        <div id="calendar" class="calendar"></div>
      </section>

      <div class="legend" aria-label="Heatmap intensity legend">
        <span>Less</span>
        <span class="swatch" style="background: var(--c0)"></span>
        <span class="swatch" style="background: var(--c1)"></span>
        <span class="swatch" style="background: var(--c2)"></span>
        <span class="swatch" style="background: var(--c3)"></span>
        <span class="swatch" style="background: var(--c4)"></span>
        <span>More</span>
      </div>
    </main>

    <script>
      const el = {
        username: document.getElementById('username'),
        token: document.getElementById('token'),
        repo: document.getElementById('repo'),
        loadAll: document.getElementById('loadAll'),
        loadRepo: document.getElementById('loadRepo'),
        sample: document.getElementById('sample'),
        status: document.getElementById('status'),
        calendar: document.getElementById('calendar'),
        summary: document.getElementById('summary'),
        mode: document.getElementById('mode')
      };

      const DAYS = 365;
      const DAY_MS = 24 * 60 * 60 * 1000;

      const setStatus = (text, type = '') => {
        el.status.className = `status ${type}`.trim();
        el.status.textContent = text;
      };

      const dateKey = (date) => date.toISOString().slice(0, 10);

      const levelClass = (count) => {
        if (!count) return '';
        if (count <= 2) return 'l1';
        if (count <= 4) return 'l2';
        if (count <= 7) return 'l3';
        return 'l4';
      };

      const buildRange = () => {
        const end = new Date();
        end.setHours(0, 0, 0, 0);
        const start = new Date(end.getTime() - (DAYS - 1) * DAY_MS);
        return { start, end };
      };

      const headers = (token) => {
        const h = { Accept: 'application/vnd.github+json' };
        if (token) h.Authorization = 'token ' + token;
        return h;
      };

      async function ghFetch(url, token) {
        const res = await fetch(url, { headers: headers(token) });
        if (!res.ok) {
          const body = await res.text();
          throw new Error(`${res.status} ${res.statusText}${body ? `: ${body.slice(0, 150)}` : ''}`);
        }
        return res.json();
      }

      async function fetchUserRepos(username, token) {
        let page = 1;
        const repos = [];
        while (page <= 4) {
          const list = await ghFetch(`https://api.github.com/users/${encodeURIComponent(username)}/repos?per_page=100&page=${page}&sort=updated`, token);
          if (!list.length) break;
          repos.push(...list);
          if (list.length < 100) break;
          page += 1;
        }
        return repos;
      }

      async function fetchRepoCommits({ owner, repo, author, token, since }) {
        let page = 1;
        const out = [];
        while (page <= 3) {
          const list = await ghFetch(
            `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/commits?author=${encodeURIComponent(author)}&since=${encodeURIComponent(since)}&per_page=100&page=${page}`,
            token
          );
          if (!Array.isArray(list) || !list.length) break;
          out.push(...list);
          if (list.length < 100) break;
          page += 1;
        }
        return out;
      }

      function aggregateByDate(commits) {
        return commits.reduce((acc, c) => {
          const stamp = c?.commit?.committer?.date || c?.commit?.author?.date;
          if (!stamp) return acc;
          const key = stamp.slice(0, 10);
          acc[key] = (acc[key] || 0) + 1;
          return acc;
        }, {});
      }

      function renderHeatmap(counts) {
        const { start } = buildRange();
        el.calendar.innerHTML = '';

        let max = 0;
        let total = 0;

        for (let i = 0; i < DAYS; i += 1) {
          const date = new Date(start.getTime() + i * DAY_MS);
          const key = dateKey(date);
          const count = counts[key] || 0;
          total += count;
          max = Math.max(max, count);

          const day = document.createElement('div');
          day.className = `day ${levelClass(count)}`.trim();
          day.title = `${key}: ${count} commit${count === 1 ? '' : 's'}`;
          day.setAttribute('aria-label', day.title);
          el.calendar.appendChild(day);
        }

        const activeDays = Object.values(counts).filter((n) => n > 0).length;
        el.summary.textContent = `Showing last ${DAYS} days • ${total} commits • ${activeDays} active days • max ${max}/day`;
      }

      function generateSampleData() {
        const { start } = buildRange();
        const counts = {};
        for (let i = 0; i < DAYS; i += 1) {
          const date = new Date(start.getTime() + i * DAY_MS);
          const weekday = date.getUTCDay();
          const burst = Math.random() > 0.92 ? Math.floor(Math.random() * 6) + 5 : 0;
          const base = weekday === 0 || weekday === 6 ? Math.floor(Math.random() * 2) : Math.floor(Math.random() * 4);
          counts[dateKey(date)] = base + burst;
        }
        return counts;
      }

      async function loadAllRepos() {
        const username = el.username.value.trim();
        const token = el.token.value.trim();
        const fallbackRepo = el.repo.value.trim();

        if (!username) {
          setStatus('Please enter a GitHub username first.', 'error');
          return;
        }

        try {
          setStatus('Loading repositories and commits…', 'loading');
          el.mode.textContent = 'Mode: all repositories';

          const { start } = buildRange();
          const repos = await fetchUserRepos(username, token);
          if (!repos.length) throw new Error('No repositories found for this user.');

          const commitBuckets = [];
          for (const r of repos) {
            try {
              const commits = await fetchRepoCommits({ owner: r.owner.login, repo: r.name, author: username, token, since: start.toISOString() });
              commitBuckets.push(...commits);
            } catch (_) {
              // Skip repositories that are inaccessible or empty.
            }
          }

          if (!commitBuckets.length) {
            throw new Error('No commits were returned across repositories for this period.');
          }

          renderHeatmap(aggregateByDate(commitBuckets));
          setStatus(`Loaded ${commitBuckets.length} commits across ${repos.length} repositories.`);
        } catch (error) {
          const base = `Could not load all repositories: ${error.message}`;
          if (fallbackRepo) {
            setStatus(`${base} Falling back to single repository: ${fallbackRepo}`, 'error');
            await loadSingleRepo(true);
          } else {
            setStatus(`${base} Showing sample data. Provide a token/repo for real data.`, 'error');
            el.mode.textContent = 'Mode: sample fallback';
            renderHeatmap(generateSampleData());
          }
        }
      }

      async function loadSingleRepo(fromFallback = false) {
        const username = el.username.value.trim();
        const token = el.token.value.trim();
        const repoText = el.repo.value.trim();

        if (!username || !repoText || !repoText.includes('/')) {
          setStatus('Enter username and fallback repo as owner/name.', 'error');
          return;
        }

        const [owner, repo] = repoText.split('/');

        try {
          setStatus('Loading commits from selected repository…', 'loading');
          el.mode.textContent = `Mode: single repository (${owner}/${repo})`;

          const { start } = buildRange();
          const commits = await fetchRepoCommits({ owner, repo, author: username, token, since: start.toISOString() });
          if (!commits.length) throw new Error('No commits found in this repository for the selected user/date range.');

          renderHeatmap(aggregateByDate(commits));
          setStatus(`${fromFallback ? 'Fallback complete.' : 'Loaded.'} ${commits.length} commits from ${owner}/${repo}.`);
        } catch (error) {
          setStatus(`Single-repo load failed: ${error.message}`, 'error');
        }
      }

      el.loadAll.addEventListener('click', loadAllRepos);
      el.loadRepo.addEventListener('click', () => loadSingleRepo(false));
      el.sample.addEventListener('click', () => {
        el.mode.textContent = 'Mode: sample';
        renderHeatmap(generateSampleData());
        setStatus('Showing sample data. Add username/token for live GitHub data.');
      });

      renderHeatmap(generateSampleData());
      setStatus('Ready. Start with "Load all repositories" or use sample data.');
    </script>
  </body>
</html>
